name: Deploy ke GitHub Pages

# Situs statis satu file — tidak ada build step.
# Setiap push ke main langsung menerbitkan ulang.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Biarkan deploy yang sedang jalan selesai, jangan dibatalkan di tengah.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Membuat situs Pages butuh hak ADMIN repo; GITHUB_TOKEN tidak punya itu
      # (gagal "Resource not accessible by integration"). Jadi jangan coba
      # menyalakannya sendiri — cek dulu, lalu beri instruksi yang jelas.
      - name: Pastikan GitHub Pages sudah aktif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "GitHub Pages aktif — lanjut deploy."
            exit 0
          fi
          echo "::error title=GitHub Pages belum aktif::Nyalakan Pages sekali secara manual, lalu jalankan ulang workflow ini."
          cat <<'TXT'

          GitHub Pages belum dinyalakan untuk repo ini.

          Workflow tidak bisa menyalakannya sendiri: endpoint "create a Pages
          site" butuh hak ADMIN repo, sedangkan GITHUB_TOKEN tidak punya itu.

          Satu langkah manual oleh pemilik repo (sekali saja):
            Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

          Lalu: Actions -> "Deploy ke GitHub Pages" -> Re-run jobs.

          Kalau setelah itu masih gagal dengan pesan izin, cek juga:
            Settings -> Actions -> General -> Workflow permissions
            -> "Read and write permissions"
          TXT
          exit 1

      - name: Siapkan Pages
        uses: actions/configure-pages@v5

      - name: Unggah isi repo sebagai artefak situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Terbitkan
        id: deployment
        uses: actions/deploy-pages@v4
